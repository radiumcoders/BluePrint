name: release

# Push a tag like v0.3.0 to build single-file binaries for Linux and Windows
# and publish them as a GitHub release. Running it by hand builds the same
# files as workflow artifacts without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      # Each platform builds on its own runner, so the binary embeds that
      # platform's OpenTUI native library.
      - name: Build
        run: bun run build

      - name: Package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          name="blueprint-$version-${{ matrix.platform }}"
          mkdir -p "pkg/$name" release
          if [ "$RUNNER_OS" = Windows ]; then
            cp dist/blueprint.exe README.md "pkg/$name/"
            (cd pkg && 7z a "../release/$name.zip" "$name" > /dev/null)
            cp dist/blueprint.exe "release/$name.exe"
          else
            cp dist/blueprint README.md "pkg/$name/"
            tar -czf "release/$name.tar.gz" -C pkg "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-${{ matrix.platform }}
          path: release/*

  release:
    if: github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
