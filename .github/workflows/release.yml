name: release

# Push a tag like v0.2.0 to build Windows binaries and publish them as a
# GitHub release. Running it by hand builds the same files as a workflow
# artifact without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "blueprint-$version-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/blueprint.exe "dist/$name/"
          Copy-Item README.md "dist/$name/"
          if (Test-Path LICENSE) { Copy-Item LICENSE "dist/$name/" }
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item target/release/blueprint.exe "dist/blueprint-$version-windows-x86_64.exe"
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
